name: prune-images

on:
  push:
    # Run once when the retention policy itself changes.
    paths:
      - ".github/workflows/prune-images.yml"
  schedule:
    # Daily, off the hour to avoid the busiest GitHub Actions window.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      min_versions:
        description: Number of untagged image versions to keep
        required: true
        default: "5"

permissions:
  contents: read
  packages: write

concurrency:
  group: prune-images
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete old untagged container versions
        uses: actions/delete-package-versions@v5
        with:
          owner: urutau-ltd
          package-name: git-cone
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: ${{ github.event.inputs.min_versions || '5' }}
          token: ${{ secrets.GITHUB_TOKEN }}
