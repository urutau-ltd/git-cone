name: git-cone-release
image: docker.io/library/golang:1.26-bookworm
secrets:
  - REGISTRY_PUSH_USER
  - REGISTRY_PUSH_PASS

env:
  PATH: /usr/local/go/bin:/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

steps:
  - name: build
    run: CGO_ENABLED=0 go build ./...

  - name: test
    run: CGO_ENABLED=0 go test ./...

  - name: smoke-build-container
    run: docker build -t git-cone-release:sha-${PIPE_COMMIT} .
